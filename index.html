<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Link de Avaliação - Google</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 0 15px;
      color: #333;
    }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    input[type="text"]:focus {
      border-color: #1a73e8;
      outline: none;
    }
    .result-box {
      background-color: #f8f9fa;
      border: 1px solid #e0e0e0;
      padding: 15px;
      border-radius: 6px;
    }
  </style>

  <!-- Script carregado com parâmetro callback=inicializarAutocomplete -->
  <script src="https://maps.googleapis.com/maps/api/js?key=SUA_NOVA_CHAVE_AQUI&libraries=places&callback=inicializarAutocomplete" async defer></script>
</head>
<body>

  <h1>Gerador de Link de Avaliação do Google</h1>

  <label for="buscaEmpresa">1. Digite o nome da empresa:</label>
  <input type="text" id="buscaEmpresa" placeholder="Ex: Farmácia São João Ponta Grossa...">

  <div class="result-box">
    <label for="linkReview">2. Link direto de avaliação (clique para selecionar):</label>
    <input type="text" id="linkReview" readonly placeholder="Selecione uma empresa acima..." onclick="this.select()">
  </div>

  <script>
    function inicializarAutocomplete() {
      const inputBusca = document.getElementById('buscaEmpresa');
      const inputLink = document.getElementById('linkReview');

      const options = {
        types: ['establishment'],
        fields: ['place_id', 'name', 'formatted_address']
      };

      const autocomplete = new google.maps.places.Autocomplete(inputBusca, options);

      autocomplete.addListener('place_changed', () => {
        const place = autocomplete.getPlace();

        if (place && place.place_id) {
          const reviewUrl = `https://search.google.com/local/writereview?placeid=${place.place_id}`;
          inputLink.value = reviewUrl;
        } else {
          inputLink.value = '';
        }
      });
    }
  </script>
</body>
</html>
