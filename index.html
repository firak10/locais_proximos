<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Link de Busca/Avaliação</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    input, button { width: 100%; padding: 12px; margin-top: 8px; font-size: 1rem; }
    .result { margin-top: 20px; word-break: break-all; }
  </style>
</head>
<body>

  <h2>Gerador de Link via Pesquisa Google</h2>

  <label>Nome da Empresa e Cidade:</label>
  <input type="text" id="empresa" placeholder="Ex: Mercado Silva Ponta Grossa">

  <button onclick="gerarLink()">Gerar Link</button>

  <div class="result" id="resultado"></div>

  <script>
    function gerarLink() {
      const termo = document.getElementById('empresa').value.trim();
      if (!termo) return;

      // Codifica o texto para URL
      const termoEncoded = encodeURIComponent(termo);
      
      // Link de busca direta no Google
      const urlGoogle = `https://www.google.com/search?q=${termoEncoded}`;

      document.getElementById('resultado').innerHTML = `
        <p><strong>Link de busca direta:</strong></p>
        <a href="${urlGoogle}" target="_blank">${urlGoogle}</a>
      `;
    }
  </script>

</body>
</html>
